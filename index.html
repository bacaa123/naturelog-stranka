<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NatureLog – Log your wild moments.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forest: '#2F5D3A',
                        moss: '#A8C686',
                        deepforest: '#1E4029',
                        cream: '#F5F1E6',
                        sunset: '#E8833A'
                    },
                    fontFamily: { sans: ['Poppins','system-ui','sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-cream text-deepforest font-sans min-h-screen flex flex-col">

<nav id="navbar" class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-moss/40 shadow-sm"></nav>

<main id="app" class="flex-1 w-full max-w-7xl mx-auto px-4 py-6"></main>

<footer class="text-center text-sm text-deepforest/60 py-6 border-t border-moss/30">
    © 2026 NatureLog — Log your wild moments. · <a href="#/rules" class="underline hover:text-forest">Pravidlá komunity</a>
</footer>

<div id="toast" class="toast"></div>

<!-- Report Modal -->
<div id="reportModal" class="modal-overlay hidden">
    <div class="modal-box">
        <h3 class="text-lg font-bold mb-3 text-deepforest">Nahlásiť príspevok</h3>
        <form id="reportForm">
            <div id="reportReasons" class="space-y-2 mb-3"></div>
            <textarea id="reportNote" maxlength="300" placeholder="Doplňujúca poznámka (nepovinné)" class="w-full border border-moss/50 rounded-lg p-2 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-forest/40"></textarea>
            <div class="flex justify-end gap-2">
                <button type="button" onclick="closeModal('reportModal')" class="btn-ghost">Zrušiť</button>
                <button type="submit" class="btn-primary">Odoslať hlásenie</button>
            </div>
        </form>
    </div>
</div>

<!-- Confirm Modal (generic) -->
<div id="confirmModal" class="modal-overlay hidden">
    <div class="modal-box">
        <p id="confirmText" class="mb-4 text-deepforest"></p>
        <div class="flex justify-end gap-2">
            <button type="button" onclick="closeModal('confirmModal')" class="btn-ghost">Zrušiť</button>
            <button type="button" id="confirmYesBtn" class="btn-primary bg-red-600 hover:bg-red-700">Potvrdiť</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
