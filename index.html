<!DOCTYPE html>
<html lang="sk" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NatureLog – Log your wild moments.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        forest: '#256B45',
                        moss: '#9ED17A',
                        deepforest: '#143322',
                        cream: '#F6F3EA',
                        sunset: '#F07B29',
                        lake: '#1E88A8',
                        gold: '#EAB308',
                        nightbg: '#09110D',
                        nightcard: '#111E17',
                        nightborder: '#233B2E'
                    },
                    fontFamily: { sans: ['Poppins', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-cream text-deepforest dark:bg-nightbg dark:text-[#EDF5F0] font-sans min-h-screen flex flex-col transition-colors duration-300 relative overflow-x-hidden">

<!-- Ambientné farebné pozadie -->
<div class="ambient-backdrop" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="ambient-grid"></div>
</div>

<nav id="navbar" class="sticky top-0 z-40 bg-white/80 dark:bg-nightcard/85 backdrop-blur-xl border-b border-forest/15 dark:border-nightborder shadow-sm"></nav>

<main id="app" class="flex-1 w-full max-w-7xl mx-auto px-4 py-6 relative z-10"></main>

<footer class="text-center text-sm text-deepforest/65 dark:text-[#9CB3A5] py-6 border-t border-forest/10 dark:border-nightborder relative z-10 bg-white/40 dark:bg-nightcard/40 backdrop-blur-md">
    © 2026 NatureLog — Log your wild moments. ·
    <a href="#/winners" class="underline hover:text-forest dark:hover:text-moss">Sieň slávy</a> ·
    <a href="#/rules" class="underline hover:text-forest dark:hover:text-moss">Pravidlá komunity</a>
</footer>

<div id="toast" class="toast"></div>

<!-- Lightbox -->
<div id="lightboxModal" class="fixed inset-0 z-[150] bg-black/92 backdrop-blur-sm hidden flex-col items-center justify-center p-4" onclick="if(event.target===this) closeLightbox()">
    <button onclick="closeLightbox()" class="absolute top-4 right-4 text-white/85 hover:text-white text-2xl px-3.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 transition">✕</button>
    <button id="lbPrev" onclick="stepLightbox(-1)" class="hidden absolute left-4 top-1/2 -translate-y-1/2 text-white/85 hover:text-white text-3xl px-3.5 py-2 rounded-full bg-white/10 hover:bg-white/20 transition">‹</button>
    <div id="lbContent" class="max-w-5xl max-h-[82vh] flex items-center justify-center"></div>
    <button id="lbNext" onclick="stepLightbox(1)" class="hidden absolute right-4 top-1/2 -translate-y-1/2 text-white/85 hover:text-white text-3xl px-3.5 py-2 rounded-full bg-white/10 hover:bg-white/20 transition">›</button>
    <p id="lbCaption" class="text-white/85 text-sm mt-3 text-center"></p>
</div>

<!-- Report Modal -->
<div id="reportModal" class="modal-overlay hidden">
    <div class="modal-box">
        <h3 class="text-lg font-bold mb-3 text-deepforest dark:text-white">Nahlásiť príspevok</h3>
        <form id="reportForm">
            <div id="reportReasons" class="space-y-2 mb-3"></div>
            <textarea id="reportNote" maxlength="300" placeholder="Doplňujúca poznámka (nepovinné)" class="field text-sm mb-3"></textarea>
            <div class="flex justify-end gap-2">
                <button type="button" onclick="closeModal('reportModal')" class="btn-ghost">Zrušiť</button>
                <button type="submit" class="btn-primary">Odoslať hlásenie</button>
            </div>
        </form>
    </div>
</div>

<!-- Confirm Modal -->
<div id="confirmModal" class="modal-overlay hidden">
    <div class="modal-box">
        <p id="confirmText" class="mb-4 text-deepforest dark:text-white"></p>
        <div class="flex justify-end gap-2">
            <button type="button" onclick="closeModal('confirmModal')" class="btn-ghost">Zrušiť</button>
            <button type="button" id="confirmYesBtn" class="btn-primary bg-red-600 hover:bg-red-700">Potvrdiť</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
